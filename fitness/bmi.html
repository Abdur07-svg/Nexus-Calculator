<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Calculator</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="calculator-wrapper">

        <div class="top-nav-bar">
            <a href="../index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </a>
        </div>
        
        
        <div class="calculator">
            <!-- App Navigation -->

            <!-- BMI Calculator View -->
            <div id="bmi-view" class="calc-view active">
                <div class="calc-header">
                    <h2>BMI Calculator</h2>
                    <p>Check your Body Mass Index</p>
                </div>
                
                <div class="form-box">
                    <div style="display: flex; gap: 10px;">
                        <div class="input-group" style="flex: 1;">
                            <label>Age</label>
                            <input type="number" id="bmi-age" placeholder="e.g. 25" class="custom-input">
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>Gender</label>
                            <select id="bmi-gender" class="custom-input">
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 10px;">
                        <div class="input-group" style="flex: 1;">
                            <label>Height (cm)</label>
                            <input type="number" id="bmi-height" placeholder="e.g. 175" class="custom-input">
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>Weight (kg)</label>
                            <input type="number" id="bmi-weight" placeholder="e.g. 70" class="custom-input">
                        </div>
                    </div>
                    
                    <button id="calc-bmi-btn" class="action-btn">Calculate BMI</button>
                    <button type="button" class="action-btn clear-btn" onclick="document.querySelectorAll('input').forEach(i => i.value=''); document.querySelectorAll('.result-container').forEach(r => r.style.display='none');" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; margin-top: 10px;">Clear Data</button>
                </div>
                
                <div class="result-container" id="bmi-result-container" style="display: none;">
                    <div class="bmi-score"><span id="bmi-score">22.9</span> <span style="font-size: 1rem; color: var(--text-secondary); font-weight: normal;">kg/m²</span></div>
                    <div class="bmi-category" id="bmi-category" style="font-size: 1.2rem; font-weight: 500; margin-top: 10px;">Normal Weight</div>
                    <div class="bmi-scale">
                        <div class="bmi-marker" id="bmi-marker"></div>
                    </div>
                </div>
            </div> <!-- End BMI View -->
        </div>
    </div>
    <script src="../js/bmi.js"></script>

    <script>
        document.addEventListener('click', function(e) {
            if (e.target && e.target.matches && e.target.matches('.action-btn:not(.clear-btn)')) {
                const formBox = e.target.closest('.form-box');
                if (formBox) {
                    const inputs = formBox.querySelectorAll('input[type="number"], input[type="text"]');
                    let isEmpty = false;
                    inputs.forEach(input => {
                        if (input.value.trim() === '') isEmpty = true;
                    });
                    
                    if (isEmpty) {
                        e.stopPropagation();
                        e.preventDefault();
                        
                        let errorMsg = formBox.querySelector('.global-error-msg');
                        if (!errorMsg) {
                            errorMsg = document.createElement('div');
                            errorMsg.className = 'global-error-msg';
                            errorMsg.style.color = '#ef4444';
                            errorMsg.style.fontSize = '0.9rem';
                            errorMsg.style.marginTop = '15px';
                            errorMsg.style.textAlign = 'center';
                            errorMsg.style.fontWeight = '500';
                            errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please fill out all required fields.';
                            
                            // Insert at the end of form-box
                            formBox.appendChild(errorMsg);
                        }
                        
                        // Hide results if they are shown
                        const resultContainer = document.querySelector('.result-container');
                        if (resultContainer) resultContainer.style.display = 'none';
                    } else {
                        const errorMsg = formBox.querySelector('.global-error-msg');
                        if (errorMsg) errorMsg.remove();
                    }
                }
            }
        }, true); // Use capture phase to intercept before the button's own listener
    </script>
</body>
</html>
