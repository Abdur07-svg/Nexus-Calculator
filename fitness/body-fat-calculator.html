<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Fat Calculator</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="calculator-wrapper">

        <div class="top-nav-bar">
            <a href="../index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </a>
        </div>
        
        
        <div class="calculator">

            <div class="calc-view active">
                <div class="calc-header">
                    <h2>Body Fat Calculator</h2>
                    <p>Calculate your body fat percentage (U.S. Navy Method)</p>
                </div>
                
                <div class="form-box">
                    <div style="display: flex; gap: 10px;">
                        <div class="input-group" style="flex: 1;">
                            <label>Gender</label>
                            <select id="bf-gender" class="custom-input">
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>Age</label>
                            <input type="number" id="bf-age" placeholder="e.g. 25" class="custom-input">
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 10px;">
                        <div class="input-group" style="flex: 1;">
                            <label>Weight (kg)</label>
                            <input type="number" id="bf-weight" placeholder="e.g. 70" class="custom-input">
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>Height (cm)</label>
                            <input type="number" id="bf-height" placeholder="e.g. 175" class="custom-input">
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <div class="input-group" style="flex: 1;">
                            <label>Neck (cm)</label>
                            <input type="number" id="bf-neck" placeholder="e.g. 38" class="custom-input">
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>Waist (cm)</label>
                            <input type="number" id="bf-waist" placeholder="e.g. 85" class="custom-input">
                        </div>
                    </div>

                    <div class="input-group" id="bf-hip-group" style="display: none;">
                        <label>Hip (cm)</label>
                        <input type="number" id="bf-hip" placeholder="e.g. 95" class="custom-input">
                    </div>
                    
                    <button id="calc-bf-btn" class="action-btn">Calculate Body Fat</button>
                </div>
                
                <div class="result-container" id="bf-result-container" style="display: none; padding: 20px;">
                    <div class="age-main" style="text-align: center; margin-bottom: 20px;">
                        <p style="color: var(--text-secondary); margin-bottom: 5px;">Body Fat Percentage</p>
                        <span id="bf-percentage" style="font-size: 2.5rem; color: var(--calc-accent); font-weight: 600;">0%</span> 
                    </div>
                    <div class="bmi-category" id="bf-category" style="font-size: 1.2rem; font-weight: 500; margin-bottom: 20px; text-align: center;">Average</div>
                    <div class="age-details" style="text-align: left; font-size: 0.95rem;">
                        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--calc-border); padding: 8px 0;">
                            <span>Body Fat Mass</span>
                            <span id="bf-fat-mass" style="font-weight: 600;">0 kg</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 8px 0;">
                            <span>Lean Body Mass</span>
                            <span id="bf-lean-mass" style="font-weight: 600;">0 kg</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/script.js"></script>
    <script src="../js/body-fat.js"></script>
</body>
</html>
