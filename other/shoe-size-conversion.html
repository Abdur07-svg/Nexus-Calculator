<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Size Conversion - Nexus</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-content { flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { color: var(--text-secondary); font-size: 14px; font-weight: 500; }
        .input-group input, .input-group select { 
            width: 100%; box-sizing: border-box; min-width: 0;
            padding: 16px; border-radius: 15px; border: 1px solid rgba(0, 0, 0, 0.1); 
            background-color: var(--btn-bg); color: var(--text-primary); font-size: 16px; 
            font-family: inherit; outline: none; transition: border-color 0.3s; 
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--btn-operator-color); }
        .btn-row { display: flex; gap: 12px; margin-top: 10px; }
        .btn-primary { flex: 2; padding: 16px; border-radius: 15px; border: none; background-color: var(--btn-operator-color); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-clear { flex: 1; padding: 16px; border-radius: 15px; border: none; background-color: #ff5252; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-primary:active, .btn-clear:active { transform: scale(0.95); }
        .result-box { background-color: var(--btn-bg); border-radius: 20px; padding: 24px; text-align: center; margin-top: 20px; display: none; }
        .result-box.active { display: block; }
        .result-value { font-size: 24px; font-weight: 700; color: var(--btn-operator-color); margin-bottom: 8px; }
        .result-details { color: var(--text-secondary); font-size: 16px; line-height: 1.6; }
        .back-btn { background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="if(history.length > 1) { history.back(); } else { window.location.href='../index.html'; }" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Shoe Size</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <div class="tool-content">
            <div class="input-group">
                <label for="age-group">Age Group</label>
                <select id="age-group">
                    <option value="adult">Adult</option>
                    <option value="child">Child</option>
                </select>
            </div>
            <div class="input-group">
                <label for="region">From Region</label>
                <select id="region">
                    <option value="us">US/Canada</option>
                    <option value="uk">UK/India</option>
                    <option value="eu">Europe (EU)</option>
                </select>
            </div>
            
            <div class="input-group" id="adult-inputs" style="display: flex; flex-direction: row; gap: 10px;">
                <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                    <label for="size-men">Men Size</label>
                    <input type="number" id="size-men" placeholder="Men's" step="0.5">
                </div>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                    <label for="size-women">Women Size</label>
                    <input type="number" id="size-women" placeholder="Women's" step="0.5">
                </div>
            </div>

            <div class="input-group" id="child-inputs" style="display: none;">
                <label for="size-child">Child Size</label>
                <input type="number" id="size-child" placeholder="Enter size" step="0.5">
            </div>

            <div class="error-msg" id="error-msg" style="color: #ff5252; font-size: 14px; display: none; margin-top: 10px;"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear</button>
                <button class="btn-primary" id="calc-btn">Convert</button>
            </div>

            <div class="result-box" id="result-box">
                <div class="result-details" id="detailed-res"></div>
            </div>
        </div>
    </div>
    <script src="../js/shoe-size-conversion.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
