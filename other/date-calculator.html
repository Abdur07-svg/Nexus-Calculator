<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Calculator</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="calculator-wrapper">

        <div class="top-nav-bar">
            <a href="../index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </a>
        </div>
        <div class="calculator">

            <div id="date-view" class="calc-view active">
                <div class="calc-header">
                    <h2>Date Calculator</h2>
                    <p>Calculate differences or add/subtract days</p>
                </div>
                
                <div class="form-box">
                    <div class="input-group">
                        <label>Calculation Type</label>
                        <select id="date-calc-type" class="custom-input">
                            <option value="difference">Difference between dates</option>
                            <option value="add_sub">Add/Subtract to date</option>
                        </select>
                    </div>

                    <!-- Difference Mode -->
                    <div id="mode-difference">
                        <div class="input-group">
                            <label>Start Date</label>
                            <input type="text" id="date-start" class="custom-input date-input" placeholder="MM/DD/YYYY">
                        </div>
                        <div class="input-group">
                            <label>End Date</label>
                            <input type="text" id="date-end" class="custom-input date-input" placeholder="MM/DD/YYYY">
                        </div>
                    </div>

                    <!-- Add/Sub Mode -->
                    <div id="mode-add-sub" style="display: none;">
                        <div class="input-group">
                            <label>Start Date</label>
                            <input type="text" id="date-base" class="custom-input date-input" placeholder="MM/DD/YYYY">
                        </div>
                        <div class="input-group" style="display: flex; gap: 10px;">
                            <select id="date-op" class="custom-input" style="flex: 1;">
                                <option value="add">Add (+)</option>
                                <option value="sub">Subtract (-)</option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <div class="input-group" style="flex: 1;">
                                <label>Years</label>
                                <input type="number" id="date-years" class="custom-input" value="0" min="0">
                            </div>
                            <div class="input-group" style="flex: 1;">
                                <label>Months</label>
                                <input type="number" id="date-months" class="custom-input" value="0" min="0">
                            </div>
                            <div class="input-group" style="flex: 1;">
                                <label>Days</label>
                                <input type="number" id="date-days" class="custom-input" value="0" min="0">
                            </div>
                        </div>
                    </div>
                    
                    <button id="calc-date-btn" class="action-btn">Calculate</button>
                    <button type="button" class="action-btn clear-btn" onclick="document.querySelectorAll('input').forEach(i => i.value=''); document.querySelectorAll('.result-container').forEach(r => r.style.display='none');" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; margin-top: 10px;">Clear Data</button>
                </div>
                
                <div class="result-container" id="date-result-container" style="display: none;">
                    <div class="age-main" id="date-main-result" style="font-size: 1.5rem;">
                        Result will appear here
                    </div>
                    <div class="age-details" id="date-details">
                        <!-- Extra details if any -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../js/script.js"></script>
    <script src="../js/date.js"></script>

    <script>
        document.addEventListener('click', function(e) {
            if (e.target && e.target.matches && e.target.matches('.action-btn:not(.clear-btn)')) {
                const formBox = e.target.closest('.form-box');
                if (formBox) {
                    const inputs = formBox.querySelectorAll('input[type="number"], input[type="text"]');
                    let isEmpty = false;
                    inputs.forEach(input => {
                        if (input.value.trim() === '') isEmpty = true;
                    });
                    
                    if (isEmpty) {
                        e.stopPropagation();
                        e.preventDefault();
                        
                        let errorMsg = formBox.querySelector('.global-error-msg');
                        if (!errorMsg) {
                            errorMsg = document.createElement('div');
                            errorMsg.className = 'global-error-msg';
                            errorMsg.style.color = '#ef4444';
                            errorMsg.style.fontSize = '0.9rem';
                            errorMsg.style.marginTop = '15px';
                            errorMsg.style.textAlign = 'center';
                            errorMsg.style.fontWeight = '500';
                            errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please fill out all required fields.';
                            
                            // Insert at the end of form-box
                            formBox.appendChild(errorMsg);
                        }
                        
                        // Hide results if they are shown
                        const resultContainer = document.querySelector('.result-container');
                        if (resultContainer) resultContainer.style.display = 'none';
                    } else {
                        const errorMsg = formBox.querySelector('.global-error-msg');
                        if (errorMsg) errorMsg.remove();
                    }
                }
            }
        }, true); // Use capture phase to intercept before the button's own listener
    </script>
</body>
</html>
