<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height Calculator - Nexus</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .tool-content {
            background-color: var(--calc-bg);
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }
        .input-group {
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: var(--btn-bg);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--btn-operator-color);
        }
        .row-group {
            display: flex;
            gap: 16px;
        }
        .row-group .input-group {
            flex: 1;
        }
        .btn-row {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }
        .result-box {
            margin-top: 30px;
            padding: 24px;
            background-color: var(--btn-bg);
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .result-value {
            font-size: 32px;
            font-weight: 600;
            color: var(--btn-operator-color);
            margin-bottom: 8px;
        }
        .result-details {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .btn-primary {
            flex: 2;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: var(--btn-operator-color);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-clear {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: #ff5252;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:active, .btn-clear:active {
            transform: scale(0.95);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
        .section-title {
            margin: 0 0 16px 0;
            font-size: 16px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="if(history.length > 1) { history.back(); } else { window.location.href='../index.html'; }" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Height Calculator</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;" id="search-btn"></i>
        </div>

        <div class="tool-content">
            <div class="input-group">
                <label for="mode-select">Calculator Mode</label>
                <select id="mode-select">
                    <option value="khamis">Child Predictor (Khamis-Roche)</option>
                    <option value="midparent">Mid-Parental Predictor</option>
                    <option value="converter">Height Converter</option>
                </select>
            </div>

            <!-- MODE 1: Khamis-Roche Predictor -->
            <div id="mode-khamis">
                <div class="row-group">
                    <div class="input-group">
                        <label>Father's Height (cm)</label>
                        <input type="number" id="k-dad-cm" placeholder="e.g. 180">
                    </div>
                    <div class="input-group">
                        <label>Mother's Height (cm)</label>
                        <input type="number" id="k-mom-cm" placeholder="e.g. 165">
                    </div>
                </div>

                <div class="row-group">
                    <div class="input-group">
                        <label>Child's Sex</label>
                        <select id="k-sex">
                            <option value="boy">Boy</option>
                            <option value="girl">Girl</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Child's Age (Years)</label>
                        <input type="number" id="k-age" placeholder="e.g. 8" min="4" max="17" step="0.5">
                    </div>
                </div>

                <div class="row-group">
                    <div class="input-group">
                        <label>Child's Height (cm)</label>
                        <input type="number" id="k-height" placeholder="e.g. 120">
                    </div>
                    <div class="input-group">
                        <label>Child's Weight (kg)</label>
                        <input type="number" id="k-weight" placeholder="e.g. 25">
                    </div>
                </div>
            </div>

            <!-- MODE 2: Mid-Parental Predictor -->
            <div id="mode-midparent" style="display: none;">
                <div class="input-group">
                    <label>Father's Height (cm)</label>
                    <input type="number" id="m-dad-cm" placeholder="e.g. 180">
                </div>
                <div class="input-group">
                    <label>Mother's Height (cm)</label>
                    <input type="number" id="m-mom-cm" placeholder="e.g. 165">
                </div>
            </div>

            <!-- MODE 3: Converter -->
            <div id="mode-converter" style="display: none;">
                <div class="input-group">
                    <label>Convert From</label>
                    <select id="conv-type">
                        <option value="cm_to_ft">CM to FT/IN</option>
                        <option value="ft_to_cm">FT/IN to CM</option>
                    </select>
                </div>

                <div id="conv-cm-group">
                    <div class="input-group">
                        <label>Centimeters (cm)</label>
                        <input type="number" id="conv-cm" placeholder="e.g. 170">
                    </div>
                </div>

                <div id="conv-ft-group" class="row-group" style="display: none;">
                    <div class="input-group">
                        <label>Feet (ft)</label>
                        <input type="number" id="conv-ft" placeholder="e.g. 5">
                    </div>
                    <div class="input-group">
                        <label>Inches (in)</label>
                        <input type="number" id="conv-in" placeholder="e.g. 7" max="11">
                    </div>
                </div>
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear Data</button>
                <button class="btn-primary" id="calc-btn">Calculate</button>
            </div>

            <div class="result-box" id="result-box">
                <div class="result-value" id="main-result">-</div>
                <div class="result-details" id="detailed-result">Enter details above to calculate</div>
            </div>
        </div>
    </div>
    
    <script src="../js/height-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
