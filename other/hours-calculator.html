<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hours Calculator - Nexus</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-content { flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .calc-section { display: none; flex-direction: column; gap: 15px; }
        .calc-section.active { display: flex; }
        .section-title { font-size: 18px; font-weight: 600; color: var(--text-primary); border-bottom: 2px solid rgba(0,0,0,0.05); padding-bottom: 10px; margin-bottom: 5px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { color: var(--text-secondary); font-size: 14px; font-weight: 500; }
        .input-group input, .input-group select { 
            width: 100%; box-sizing: border-box; min-width: 0;
            padding: 16px; border-radius: 15px; border: 1px solid rgba(0, 0, 0, 0.1); 
            background-color: var(--btn-bg); color: var(--text-primary); font-size: 16px; 
            font-family: inherit; outline: none; transition: border-color 0.3s; 
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--btn-operator-color); }
        .btn-row { display: flex; gap: 12px; margin-top: 5px; }
        .btn-primary { flex: 2; padding: 16px; border-radius: 15px; border: none; background-color: var(--btn-operator-color); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-clear { flex: 1; padding: 16px; border-radius: 15px; border: none; background-color: #ff5252; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-primary:active, .btn-clear:active { transform: scale(0.95); }
        .result-box { background: rgba(33, 150, 243, 0.08); border: 1px solid rgba(33, 150, 243, 0.2); border-radius: 15px; padding: 20px; text-align: center; margin-top: 10px; display: none; }
        .result-box.active { display: block; }
        .result-details { color: var(--text-primary); font-size: 15px; line-height: 1.6; }
        .back-btn { background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; }
        .error-msg { color: #ff5252; font-size: 14px; display: none; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="window.location.href='../index.html'" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Hours Calculator</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <div class="tool-content">
            
            <div class="input-group" style="margin-bottom: 5px;">
                <label for="calc-mode">Select Calculator Mode</label>
                <select id="calc-mode">
                    <option value="duration">Calculate Duration Between Times</option>
                    <option value="add-sub">Find the time after X hours (Add/Subtract)</option>
                    <option value="weekly">Find Weekly Working Hours</option>
                    <option value="convert">Convert Hours</option>
                </select>
            </div>

            <!-- Duration -->
            <div id="section-duration" class="calc-section active">
                <div class="input-group">
                    <label for="start-time">Start Time</label>
                    <input type="time" id="start-time">
                </div>
                <div class="input-group">
                    <label for="end-time">End Time</label>
                    <input type="time" id="end-time">
                </div>
                <div class="input-group">
                    <label for="break-mins">Break Deduction (Minutes)</label>
                    <input type="number" id="break-mins" placeholder="e.g. 30" min="0" step="1" value="0">
                </div>
                <div class="error-msg" id="error-duration"></div>
                <div class="btn-row">
                    <button class="btn-clear" id="clear-duration">Clear</button>
                    <button class="btn-primary" id="calc-duration">Calculate Duration</button>
                </div>
                <div class="result-box" id="result-duration">
                    <div class="result-details" id="detail-duration"></div>
                </div>
            </div>

            <!-- Add / Subtract -->
            <div id="section-add-sub" class="calc-section">
                <div class="input-group">
                    <label for="base-time">Start Time</label>
                    <input type="time" id="base-time">
                </div>
                <div class="input-group">
                    <label for="op-time">Operation</label>
                    <select id="op-time">
                        <option value="add">Add Time</option>
                        <option value="sub">Subtract Time</option>
                    </select>
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="input-group" style="flex:1;">
                        <label for="add-hours">Hours</label>
                        <input type="number" id="add-hours" value="0" min="0">
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label for="add-mins">Minutes</label>
                        <input type="number" id="add-mins" value="0" min="0">
                    </div>
                </div>
                <div class="error-msg" id="error-add"></div>
                <div class="btn-row">
                    <button class="btn-clear" id="clear-add">Clear</button>
                    <button class="btn-primary" id="calc-add">Calculate New Time</button>
                </div>
                <div class="result-box" id="result-add">
                    <div class="result-details" id="detail-add"></div>
                </div>
            </div>

            <!-- Weekly -->
            <div id="section-weekly" class="calc-section">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div class="input-group"><label>Mon Hours</label><input type="number" class="week-input" value="0" min="0" step="any"></div>
                    <div class="input-group"><label>Tue Hours</label><input type="number" class="week-input" value="0" min="0" step="any"></div>
                    <div class="input-group"><label>Wed Hours</label><input type="number" class="week-input" value="0" min="0" step="any"></div>
                    <div class="input-group"><label>Thu Hours</label><input type="number" class="week-input" value="0" min="0" step="any"></div>
                    <div class="input-group"><label>Fri Hours</label><input type="number" class="week-input" value="0" min="0" step="any"></div>
                    <div class="input-group"><label>Sat Hours</label><input type="number" class="week-input" value="0" min="0" step="any"></div>
                    <div class="input-group" style="grid-column: span 2;"><label>Sun Hours</label><input type="number" class="week-input" value="0" min="0" step="any"></div>
                </div>
                <div class="error-msg" id="error-weekly"></div>
                <div class="btn-row">
                    <button class="btn-clear" id="clear-weekly">Clear</button>
                    <button class="btn-primary" id="calc-weekly">Calculate Weekly Total</button>
                </div>
                <div class="result-box" id="result-weekly">
                    <div class="result-details" id="detail-weekly"></div>
                </div>
            </div>

            <!-- Convert -->
            <div id="section-convert" class="calc-section">
                <div class="input-group">
                    <label for="decimal-hours">Decimal Hours (e.g. 2.5)</label>
                    <input type="number" id="decimal-hours" step="any" min="0" placeholder="0.0">
                </div>
                <div class="error-msg" id="error-convert"></div>
                <div class="btn-row">
                    <button class="btn-clear" id="clear-convert">Clear</button>
                    <button class="btn-primary" id="calc-convert">Convert Hours</button>
                </div>
                <div class="result-box" id="result-convert">
                    <div class="result-details" id="detail-convert"></div>
                </div>
            </div>

        </div>
    </div>
    <script src="../js/hours-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
