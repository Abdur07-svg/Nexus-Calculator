<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Cost Calculator - Nexus</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-content { flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { color: var(--text-secondary); font-size: 14px; font-weight: 500; }
        .input-group input, .input-group select { 
            width: 100%; box-sizing: border-box; min-width: 0;
            padding: 16px; border-radius: 15px; border: 1px solid rgba(0, 0, 0, 0.1); 
            background-color: var(--btn-bg); color: var(--text-primary); font-size: 16px; 
            font-family: inherit; outline: none; transition: border-color 0.3s; 
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--btn-operator-color); }
        .btn-row { display: flex; gap: 12px; margin-top: 10px; }
        .btn-primary { flex: 2; padding: 16px; border-radius: 15px; border: none; background-color: var(--btn-operator-color); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-clear { flex: 1; padding: 16px; border-radius: 15px; border: none; background-color: #ff5252; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-primary:active, .btn-clear:active { transform: scale(0.95); }
        .result-box { background: rgba(33, 150, 243, 0.08); border: 1px solid rgba(33, 150, 243, 0.2); border-radius: 15px; padding: 20px; text-align: center; margin-top: 20px; display: none; }
        .result-box.active { display: block; }
        .result-details { color: var(--text-primary); font-size: 15px; line-height: 1.6; }
        .back-btn { background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; }
        .error-msg { color: #ff5252; font-size: 14px; display: none; margin-top: 5px; text-align: center; }
        .cost-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 15px; }
        .cost-item { background: rgba(0,0,0,0.03); padding: 15px; border-radius: 10px; }
        .cost-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 5px; }
        .cost-value { font-size: 22px; font-weight: 700; color: var(--btn-operator-color); }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="if(history.length > 1) { history.back(); } else { window.location.href='../index.html'; }" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Electricity Cost</h2>
            <i class="fa-solid fa-magnifying-glass" id="search-btn" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <div class="tool-content">
            <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: -10px;">Calculate power consumption cost.</div>
            
            <div class="input-group">
                <label for="power">Power Consumption</label>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="power" placeholder="e.g. 100" style="flex:2;" step="any" min="0">
                    <select id="power-unit" style="flex:1; max-width: 110px;">
                        <option value="watts">Watts (W)</option>
                        <option value="kw" selected>Kilowatts (kW)</option>
                        <option value="mw">Megawatts (MW)</option>
                        <option value="gw">Gigawatts (GW)</option>
                        <option value="btu">BTU/h</option>
                        <option value="hp">Horsepower (hp)</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">
                <label for="hours">Usage Time (per day)</label>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="hours" placeholder="e.g. 8" style="flex:2;" step="any" min="0">
                    <select id="time-unit" style="flex:1; max-width: 110px;">
                        <option value="hours" selected>Hours</option>
                        <option value="minutes">Minutes</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="rate">Electricity Rate</label>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="rate" placeholder="e.g. 0.15" style="flex:2;" step="any" min="0">
                    <select id="rate-unit" style="flex:1; max-width: 110px;">
                        <option value="kwh" selected>per kWh</option>
                        <option value="wh">per Wh</option>
                        <option value="mwh">per MWh</option>
                    </select>
                </div>
            </div>

            <div class="error-msg" id="error-msg">Please enter valid positive numbers.</div>

            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear</button>
                <button class="btn-primary" id="calc-btn">Calculate Cost</button>
            </div>

            <div class="result-box" id="result-box">
                <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 5px;">Energy Consumed</div>
                <div style="font-size: 28px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px;" id="result-kwh">0 kWh / day</div>
                
                <div class="cost-grid">
                    <div class="cost-item">
                        <div class="cost-label">Daily Cost</div>
                        <div class="cost-value" id="cost-day">$0.00</div>
                    </div>
                    <div class="cost-item">
                        <div class="cost-label">Monthly Cost (30 days)</div>
                        <div class="cost-value" id="cost-month">$0.00</div>
                    </div>
                    <div class="cost-item">
                        <div class="cost-label">Yearly Cost</div>
                        <div class="cost-value" id="cost-year">$0.00</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/search.js"></script>
    <script src="../js/electricity-calculator.js"></script>
</body>
</html>
