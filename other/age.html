<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Calculator</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="calculator-wrapper">

                <div class="top-nav-bar" style="justify-content: space-between; align-items: center; border-bottom: 1px solid var(--calc-border); padding-bottom: 10px; margin-bottom: 20px; display: flex;">
            <a href="../index.html" style="text-decoration: none; color: var(--text-primary); font-size: 1.3rem; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-arrow-left" style="font-size: 1.1rem; margin-right: 5px; color: var(--text-secondary);"></i>
                Nexus <span style="color: #38bdf8; font-weight: 400; margin-left: 2px;">Calculator</span>
            </a>
            <button class="nav-btn circular" onclick="openGlobalSearch()" style="background: transparent; border: none; color: var(--text-primary); font-size: 1.2rem; cursor: pointer; padding: 5px;">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        
        <div class="calculator">
            <!-- App Navigation -->

            <!-- Age Calculator View -->
            <div id="age-view" class="calc-view active">
                <div class="calc-header">
                    <h2>Age Calculator</h2>
                    <p>Calculate your exact age</p>
                </div>
                
                <div class="form-box">
                    <div class="input-group">
                        <label>Date of Birth</label>
                        <input type="text" id="age-dob" class="custom-input date-input" placeholder="DD/MM/YYYY">
                    </div>
                    
                    <div class="input-group">
                        <label>Calculate age at</label>
                        <input type="text" id="age-target" class="custom-input date-input" placeholder="DD/MM/YYYY">
                    </div>
                    
                    <button id="calc-age-btn" class="action-btn">Calculate Age</button>
                    <button type="button" class="action-btn clear-btn" onclick="document.querySelectorAll('input').forEach(i => i.value=''); document.querySelectorAll('.result-container').forEach(r => r.style.display='none');" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; margin-top: 10px;">Clear Data</button>
                </div>
                
                <div class="result-container" id="age-result-container" style="display: none;">
                    <div class="age-main" id="age-main-result">
                        <span id="age-years">0</span> years 
                        <span id="age-months">0</span> months 
                        <span id="age-days">0</span> days
                    </div>
                    <div class="age-details">
                        <p>Total Months: <span id="age-total-months">0</span></p>
                        <p>Total Weeks: <span id="age-total-weeks">0</span></p>
                        <p>Total Days: <span id="age-total-days">0</span></p>
                    </div>
                </div>
            </div> <!-- End Age View -->

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../js/script.js"></script>
    <script src="../js/age.js"></script>

    <script>
        document.addEventListener('click', function(e) {
            if (e.target && e.target.matches && e.target.matches('.action-btn:not(.clear-btn)')) {
                const formBox = e.target.closest('.form-box');
                if (formBox) {
                    const inputs = formBox.querySelectorAll('input[type="number"], input[type="text"]');
                    let isEmpty = false;
                    inputs.forEach(input => {
                        if (input.value.trim() === '') isEmpty = true;
                    });
                    
                    if (isEmpty) {
                        e.stopPropagation();
                        e.preventDefault();
                        
                        let errorMsg = formBox.querySelector('.global-error-msg');
                        if (!errorMsg) {
                            errorMsg = document.createElement('div');
                            errorMsg.className = 'global-error-msg';
                            errorMsg.style.color = '#ef4444';
                            errorMsg.style.fontSize = '0.9rem';
                            errorMsg.style.marginTop = '15px';
                            errorMsg.style.textAlign = 'center';
                            errorMsg.style.fontWeight = '500';
                            errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please fill out all required fields.';
                            
                            // Insert at the end of form-box
                            formBox.appendChild(errorMsg);
                        }
                        
                        // Hide results if they are shown
                        const resultContainer = document.querySelector('.result-container');
                        if (resultContainer) resultContainer.style.display = 'none';
                    } else {
                        const errorMsg = formBox.querySelector('.global-error-msg');
                        if (errorMsg) errorMsg.remove();
                    }
                }
            }
        }, true); // Use capture phase to intercept before the button's own listener
    </script>
</body>
</html>
