<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistor Calculator - Nexus</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-content { flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { color: var(--text-secondary); font-size: 14px; font-weight: 500; }
        .input-group input, .input-group select { 
            width: 100%; box-sizing: border-box; min-width: 0;
            padding: 16px; border-radius: 15px; border: 1px solid rgba(0, 0, 0, 0.1); 
            background-color: var(--btn-bg); color: var(--text-primary); font-size: 16px; 
            font-family: inherit; outline: none; transition: border-color 0.3s; 
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--btn-operator-color); }
        .btn-row { display: flex; gap: 12px; margin-top: 10px; }
        .btn-primary { flex: 2; padding: 16px; border-radius: 15px; border: none; background-color: var(--btn-operator-color); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-clear { flex: 1; padding: 16px; border-radius: 15px; border: none; background-color: #ff5252; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-primary:active, .btn-clear:active { transform: scale(0.95); }
        .result-box { background: rgba(33, 150, 243, 0.08); border: 1px solid rgba(33, 150, 243, 0.2); border-radius: 15px; padding: 20px; text-align: center; margin-top: 20px; display: none; }
        .result-box.active { display: block; }
        .result-details { color: var(--text-primary); font-size: 15px; line-height: 1.6; }
        .back-btn { background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; }
        .error-msg { color: #ff5252; font-size: 14px; display: none; margin-top: 5px; text-align: center; }
        .color-preview { width: 20px; height: 20px; border-radius: 50%; display: inline-block; vertical-align: middle; border: 1px solid rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="if(history.length > 1) { history.back(); } else { window.location.href='../index.html'; }" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Resistor Code</h2>
            <i class="fa-solid fa-magnifying-glass" id="search-btn" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <div class="tool-content">
            <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: -10px;">Calculate 4-band resistor values.</div>
            
            <div class="input-group">
                <label for="band1">1st Band (1st Digit)</label>
                <select id="band1" class="color-select">
                    <option value="1">Brown</option>
                    <option value="2">Red</option>
                    <option value="3">Orange</option>
                    <option value="4">Yellow</option>
                    <option value="5">Green</option>
                    <option value="6">Blue</option>
                    <option value="7">Violet</option>
                    <option value="8">Gray</option>
                    <option value="9">White</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="band2">2nd Band (2nd Digit)</label>
                <select id="band2" class="color-select">
                    <option value="0">Black</option>
                    <option value="1">Brown</option>
                    <option value="2">Red</option>
                    <option value="3">Orange</option>
                    <option value="4">Yellow</option>
                    <option value="5">Green</option>
                    <option value="6">Blue</option>
                    <option value="7">Violet</option>
                    <option value="8">Gray</option>
                    <option value="9">White</option>
                </select>
            </div>

            <div class="input-group">
                <label for="multiplier">3rd Band (Multiplier)</label>
                <select id="multiplier" class="color-select">
                    <option value="1">Black (x1)</option>
                    <option value="10">Brown (x10)</option>
                    <option value="100">Red (x100)</option>
                    <option value="1000">Orange (x1k)</option>
                    <option value="10000">Yellow (x10k)</option>
                    <option value="100000">Green (x100k)</option>
                    <option value="1000000">Blue (x1M)</option>
                    <option value="10000000">Violet (x10M)</option>
                    <option value="0.1">Gold (x0.1)</option>
                    <option value="0.01">Silver (x0.01)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="tolerance">4th Band (Tolerance)</label>
                <select id="tolerance" class="color-select">
                    <option value="5" selected>Gold (±5%)</option>
                    <option value="10">Silver (±10%)</option>
                    <option value="1">Brown (±1%)</option>
                    <option value="2">Red (±2%)</option>
                    <option value="0.5">Green (±0.5%)</option>
                    <option value="0.25">Blue (±0.25%)</option>
                    <option value="0.1">Violet (±0.1%)</option>
                </select>
            </div>

            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear</button>
                <button class="btn-primary" id="calc-btn">Calculate</button>
            </div>

            <div class="result-box" id="result-box">
                <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 5px;">Resistance Value</div>
                <div style="font-size: 36px; font-weight: 700; color: var(--btn-operator-color); margin-bottom: 10px;" id="result-value">0 Ω</div>
                <div class="result-details" id="result-tolerance" style="font-weight: 600;">±5%</div>
            </div>
        </div>
    </div>
    <script src="../js/search.js"></script>
    <script src="../js/resistor-calculator.js"></script>
</body>
</html>
