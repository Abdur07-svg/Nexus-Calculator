<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltage Drop Calculator - Nexus</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .tool-content {
            background-color: var(--calc-bg);
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }
        .input-group {
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: var(--btn-bg);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--btn-operator-color);
        }
        .row-group {
            display: flex;
            gap: 16px;
        }
        .row-group .input-group {
            flex: 1;
        }
        .btn-row {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }
                .result-box {
            margin-top: 30px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            display: none;
        }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .result-item {
            background-color: var(--btn-bg);
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        .result-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .result-value {
            font-size: 24px;
            word-break: break-word;
            color: var(--btn-operator-color);
            font-weight: 600;
        }
        .result-value.normal {
            color: #4caf50;
        }

        .btn-primary {
            flex: 2;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: var(--btn-operator-color);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-clear {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: #ff5252;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:active, .btn-clear:active {
            transform: scale(0.95);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
        .error-msg {
            color: #ff5252;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="window.location.href='../index.html'" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Voltage Drop</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;" id="search-btn"></i>
        </div>

        <div class="tool-content">
            
            <div class="row-group">
                <div class="input-group">
                    <label>Material</label>
                    <select id="vd-material">
                        <option value="copper">Copper</option>
                        <option value="aluminum">Aluminum</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Phase</label>
                    <select id="vd-phase">
                        <option value="1">Single Phase (1ø)</option>
                        <option value="3">Three Phase (3ø)</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Wire Size (AWG/kcmil)</label>
                <select id="vd-awg">
                    <option value="14">14 AWG</option>
                    <option value="12" selected>12 AWG</option>
                    <option value="10">10 AWG</option>
                    <option value="8">8 AWG</option>
                    <option value="6">6 AWG</option>
                    <option value="4">4 AWG</option>
                    <option value="3">3 AWG</option>
                    <option value="2">2 AWG</option>
                    <option value="1">1 AWG</option>
                    <option value="1/0">1/0 AWG</option>
                    <option value="2/0">2/0 AWG</option>
                    <option value="3/0">3/0 AWG</option>
                    <option value="4/0">4/0 AWG</option>
                </select>
            </div>
            
            <div class="row-group">
                <div class="input-group">
                    <label>Voltage (V)</label>
                    <input type="number" id="vd-voltage" placeholder="e.g. 120">
                </div>
                <div class="input-group">
                    <label>Current (Amps)</label>
                    <input type="number" id="vd-amps" placeholder="e.g. 15">
                </div>
            </div>

            <div class="input-group">
                <label>Distance (one-way, ft)</label>
                <input type="number" id="vd-dist" placeholder="e.g. 100">
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear Data</button>
                <button class="btn-primary" id="calc-btn">Calculate</button>
            </div>

            <div class="result-box" id="result-box">
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">Voltage Drop</div>
                        <div class="result-value" id="res-drop">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Voltage Drop Percentage</div>
                        <div class="result-value normal" id="res-percent">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Voltage at End of Circuit</div>
                        <div class="result-value" id="res-end">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../js/voltage-drop-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
