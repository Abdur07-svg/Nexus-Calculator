<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Calculator - Nexus</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-content { flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { color: var(--text-secondary); font-size: 14px; font-weight: 500; }
        .input-group input, .input-group select { 
            padding: 16px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); 
            background-color: var(--btn-bg); color: var(--text-primary); font-size: 16px; 
            font-family: inherit; outline: none; transition: border-color 0.3s; 
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--btn-operator-color); }
        .btn-row { display: flex; gap: 12px; margin-top: 10px; }
        .btn-primary { flex: 2; padding: 16px; border-radius: 15px; border: none; background-color: var(--btn-operator-color); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-clear { flex: 1; padding: 16px; border-radius: 15px; border: none; background-color: #ff5252; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-primary:active, .btn-clear:active { transform: scale(0.95); }
        .result-box { background-color: var(--btn-bg); border-radius: 20px; padding: 24px; text-align: center; margin-top: 20px; display: none; }
        .result-box.active { display: block; }
        .result-value { font-size: 32px; font-weight: 700; color: var(--btn-operator-color); margin-bottom: 8px; }
        .result-details { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
        .back-btn { background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="window.location.href='../index.html'" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Mass Calculator</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <div class="tool-content" style="gap: 0;">
            <!-- Section 1: Calculate Mass -->
            <div class="calculator-section" style="background: var(--btn-bg); padding: 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);">
                <h3 style="color: var(--text-primary); margin-bottom: 20px; margin-top: 0; font-size: 18px;">Calculate Mass</h3>
                
                <div class="input-group">
                    <label>Volume</label>
                    <div style="display:flex; gap:10px; width:100%; box-sizing:border-box;">
                        <input type="number" id="mass-vol" placeholder="Volume" style="flex:2; box-sizing:border-box; min-width:0;" step="any">
                        <select id="mass-vol-unit" style="flex:1; box-sizing:border-box; min-width:0;">
                            <option value="m3">m³</option>
                            <option value="cm3">cm³</option>
                            <option value="l">Liters</option>
                        </select>
                    </div>
                </div>
                
                <div class="input-group" style="margin-top: 15px;">
                    <label>Density</label>
                    <div style="display:flex; gap:10px; width:100%; box-sizing:border-box;">
                        <input type="number" id="mass-den" placeholder="Density" style="flex:2; box-sizing:border-box; min-width:0;" step="any">
                        <select id="mass-den-unit" style="flex:1; box-sizing:border-box; min-width:0;">
                            <option value="kg_m3">kg/m³</option>
                            <option value="g_cm3">g/cm³</option>
                        </select>
                    </div>
                </div>

                <div class="error-msg" id="mass-error" style="color: #ff5252; font-size: 14px; display: none; margin-top: 10px;"></div>
                <div class="btn-row" style="margin-top: 20px;">
                    <button class="btn-clear" id="mass-clear-btn">Clear</button>
                    <button class="btn-primary" id="mass-calc-btn">Calculate Mass</button>
                </div>

                <div class="result-box" id="mass-result-box" style="margin-top: 20px; background: rgba(33, 150, 243, 0.08); border: 1px solid rgba(33, 150, 243, 0.2); border-radius: 15px; padding: 20px;">
                    <div class="result-value" id="mass-main-res" style="font-size: 28px; line-height: 1.4;">-</div>
                </div>
            </div>

            <!-- Section 2: Calculate Volume -->
            <div class="calculator-section" style="background: var(--btn-bg); padding: 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); margin-top: 24px;">
                <h3 style="color: var(--text-primary); margin-bottom: 20px; margin-top: 0; font-size: 18px;">Calculate Volume</h3>
                
                <div class="input-group">
                    <label>Length</label>
                    <div style="display:flex; gap:10px; width:100%; box-sizing:border-box;">
                        <input type="number" id="vol-len" placeholder="Length" style="flex:2; box-sizing:border-box; min-width:0;" step="any">
                        <select id="vol-len-unit" style="flex:1; box-sizing:border-box; min-width:0;">
                            <option value="m">Meters (m)</option>
                            <option value="cm">cm</option>
                            <option value="in">Inches (in)</option>
                            <option value="ft">Feet (ft)</option>
                        </select>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label>Width</label>
                    <div style="display:flex; gap:10px; width:100%; box-sizing:border-box;">
                        <input type="number" id="vol-wid" placeholder="Width" style="flex:2; box-sizing:border-box; min-width:0;" step="any">
                        <select id="vol-wid-unit" style="flex:1; box-sizing:border-box; min-width:0;">
                            <option value="m">Meters (m)</option>
                            <option value="cm">cm</option>
                            <option value="in">Inches (in)</option>
                            <option value="ft">Feet (ft)</option>
                        </select>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label>Height</label>
                    <div style="display:flex; gap:10px; width:100%; box-sizing:border-box;">
                        <input type="number" id="vol-hei" placeholder="Height" style="flex:2; box-sizing:border-box; min-width:0;" step="any">
                        <select id="vol-hei-unit" style="flex:1; box-sizing:border-box; min-width:0;">
                            <option value="m">Meters (m)</option>
                            <option value="cm">cm</option>
                            <option value="in">Inches (in)</option>
                            <option value="ft">Feet (ft)</option>
                        </select>
                    </div>
                </div>

                <div class="error-msg" id="vol-error" style="color: #ff5252; font-size: 14px; display: none; margin-top: 10px;"></div>
                <div class="btn-row" style="margin-top: 20px;">
                    <button class="btn-clear" id="vol-clear-btn">Clear</button>
                    <button class="btn-primary" id="vol-calc-btn">Calculate Volume</button>
                </div>

                <div class="result-box" id="vol-result-box" style="margin-top: 20px; background: rgba(33, 150, 243, 0.08); border: 1px solid rgba(33, 150, 243, 0.2); border-radius: 15px; padding: 20px;">
                    <div class="result-value" id="vol-main-res" style="font-size: 28px; margin-bottom: 8px;">-</div>
                    <div class="result-details" id="vol-det-res"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/mass-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
