<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Footage Calculator - Nexus</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .tool-content {
            background-color: var(--calc-bg);
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }
        .input-group {
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: var(--btn-bg);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--btn-operator-color);
        }
        .row-group {
            display: flex;
            gap: 16px;
        }
        .row-group .input-group {
            flex: 1;
        }
        .btn-row {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }
        .btn-primary, .btn-clear {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff5252 0%, #ff0000 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 82, 82, 0.3);
        }
        .btn-clear {
            background-color: var(--btn-bg);
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-primary:active, .btn-clear:active {
            transform: scale(0.98);
        }
        .result-box {
            margin-top: 30px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            display: none;
        }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .result-item {
            background-color: var(--btn-bg);
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        .result-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .result-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-word;
        }
        .result-value.highlight {
            color: #4caf50;
            font-size: 24px;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
        .error-msg {
            color: #ff5252;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="window.location.href='../index.html'" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Square Footage</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;" id="search-btn"></i>
        </div>

        <div class="tool-content">
            <div class="row-group">
                <div class="input-group">
                    <label>Length</label>
                    <input type="number" id="sq-length" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Width</label>
                    <input type="number" id="sq-width" placeholder="0">
                </div>
            </div>
            
            <div class="input-group">
                <label>Unit</label>
                <select id="sq-unit">
                    <option value="feet">Feet (ft)</option>
                    <option value="meters">Meters (m)</option>
                    <option value="inches">Inches (in)</option>
                    <option value="cm">Centimeters (cm)</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Price per Square Unit (Optional)</label>
                <input type="number" id="sq-price" placeholder="e.g. 5.50">
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear</button>
                <button class="btn-primary" id="calc-btn">Calculate</button>
            </div>

            <div class="result-box" id="result-box">
                <div class="result-grid">
                    <div class="result-item" style="grid-column: span 2;">
                        <div class="result-label">Total Area</div>
                        <div class="result-value highlight" id="res-area">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Square Feet (sq ft)</div>
                        <div class="result-value" id="res-sqft">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Square Meters (m²)</div>
                        <div class="result-value" id="res-sqm">-</div>
                    </div>
                    <div class="result-item" style="grid-column: span 2;" id="cost-box">
                        <div class="result-label">Total Estimated Cost</div>
                        <div class="result-value" id="res-cost" style="color: #ff9800; font-size: 24px;">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../js/square-footage-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
