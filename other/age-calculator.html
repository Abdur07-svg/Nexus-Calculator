<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - Nexus</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-content {
            flex-grow: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-group label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input {
            padding: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--btn-bg);
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: var(--btn-operator-color);
        }
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn-primary {
            flex: 2;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: var(--btn-operator-color);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-clear {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: #ff5252;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:active, .btn-clear:active {
            transform: scale(0.95);
        }
        .result-box {
            background-color: var(--btn-bg);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        .result-box.active {
            display: block;
        }
        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--btn-operator-color);
            margin-bottom: 8px;
        }
        .result-details {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="if(history.length > 1) { history.back(); } else { window.location.href='../index.html'; }" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Age Calculator</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <div class="tool-content">
            <div class="input-group">
                <label for="dob-text">Date of Birth (DD/MM/YYYY)</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="text" id="dob-text" placeholder="DD/MM/YYYY" required style="flex:1;">
                    <input type="date" id="dob-picker" style="position: absolute; right: 0; opacity: 0; width: 40px; height: 100%; cursor: pointer;">
                    <i class="fa-regular fa-calendar" style="position: absolute; right: 15px; pointer-events: none; color: var(--text-secondary);"></i>
                </div>
            </div>
            
            <div class="input-group">
                <label for="target-date-text">Today's Date (DD/MM/YYYY)</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="text" id="target-date-text" placeholder="DD/MM/YYYY" required style="flex:1;">
                    <input type="date" id="target-date-picker" style="position: absolute; right: 0; opacity: 0; width: 40px; height: 100%; cursor: pointer;">
                    <i class="fa-regular fa-calendar" style="position: absolute; right: 15px; pointer-events: none; color: var(--text-secondary);"></i>
                </div>
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear Data</button>
                <button class="btn-primary" id="calc-btn">Calculate Age</button>
            </div>

            <div class="result-box" id="result-box">
                <div class="result-value" id="main-age">-</div>
                <div class="result-details" id="detailed-age">-</div>
            </div>
        </div>
    </div>
    <script src="../js/age-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
