<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dew Point Calculator - Nexus</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-content { flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { color: var(--text-secondary); font-size: 14px; font-weight: 500; }
        .input-group input, .input-group select { 
            width: 100%; box-sizing: border-box; min-width: 0;
            padding: 16px; border-radius: 15px; border: 1px solid rgba(0, 0, 0, 0.1); 
            background-color: var(--btn-bg); color: var(--text-primary); font-size: 16px; 
            font-family: inherit; outline: none; transition: border-color 0.3s; 
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--btn-operator-color); }
        .btn-row { display: flex; gap: 12px; margin-top: 10px; }
        .btn-primary { flex: 2; padding: 16px; border-radius: 15px; border: none; background-color: var(--btn-operator-color); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-clear { flex: 1; padding: 16px; border-radius: 15px; border: none; background-color: #ff5252; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-primary:active, .btn-clear:active { transform: scale(0.95); }
        .result-box { background: rgba(33, 150, 243, 0.08); border: 1px solid rgba(33, 150, 243, 0.2); border-radius: 15px; padding: 20px; text-align: center; margin-top: 20px; display: none; }
        .result-box.active { display: block; }
        .result-details { color: var(--text-primary); font-size: 15px; line-height: 1.6; }
        .back-btn { background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; }
        .error-msg { color: #ff5252; font-size: 14px; display: none; margin-top: 5px; text-align: center; }

        .details-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; text-align: left; }
        .details-item { background: var(--calc-bg); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(0,0,0,0.05); }
        .details-label { color: var(--text-secondary); font-size: 13px; font-weight: 500; }
        .details-value { color: var(--text-primary); font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="window.location.href='../index.html'" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Dew Point</h2>
            <i class="fa-solid fa-magnifying-glass" id="search-btn" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <div class="tool-content">
            <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: -10px;">Calculate the temperature at which dew forms.</div>
            
            <div class="input-group">
                <label for="temp">Air Temperature</label>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="temp" placeholder="e.g. 70" style="flex:2;" step="any">
                    <select id="unit-temp" style="flex:1; max-width: 90px;">
                        <option value="f" selected>°F</option>
                        <option value="c">°C</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">
                <label for="humidity">Relative Humidity (%)</label>
                <input type="number" id="humidity" placeholder="e.g. 50" step="any" min="0" max="100">
            </div>

            <div class="error-msg" id="error-msg">Please enter valid values. Humidity must be 0 - 100.</div>

            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear</button>
                <button class="btn-primary" id="calc-btn">Calculate</button>
            </div>

            <div class="result-box" id="result-box">
                <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 5px;">Dew Point Temperature</div>
                <div style="font-size: 36px; font-weight: 700; color: var(--btn-operator-color); margin-bottom: 5px;" id="result-dew">0 °F</div>
                <div class="result-details" id="result-comfort" style="font-weight: 500; color: var(--text-secondary);">Comfort Level</div>
                
                <div class="details-grid">
                    <div class="details-item">
                        <div class="details-label">Water Vapor Pressure</div>
                        <div class="details-value" id="res-vp">0 Pa</div>
                    </div>
                    <div class="details-item">
                        <div class="details-label">Saturation Vapor Pressure</div>
                        <div class="details-value" id="res-svp">0 Pa</div>
                    </div>
                    <div class="details-item">
                        <div class="details-label">Absolute Humidity</div>
                        <div class="details-value" id="res-ah">0 g/m³</div>
                    </div>
                    <div class="details-item">
                        <div class="details-label">Moisture Volume Conc.</div>
                        <div class="details-value" id="res-mvc">0 ppm (0%)</div>
                    </div>
                    <div class="details-item">
                        <div class="details-label">Moisture Weight Conc.</div>
                        <div class="details-value" id="res-mwc">0 ppm (0%)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/search.js"></script>
    <script src="../js/dew-point-calculator.js"></script>
</body>
</html>
