<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator - Nexus</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-content {
            flex-grow: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .input-group label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input {
            padding: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--btn-bg);
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: var(--btn-operator-color);
        }
        .prefix {
            position: absolute;
            left: 16px;
            top: 40px;
            color: var(--text-secondary);
        }
        .input-group input.has-prefix {
            padding-left: 35px;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn-primary {
            flex: 2;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: var(--btn-operator-color);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-clear {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: #ff5252;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-primary:active, .btn-clear:active {
            transform: scale(0.95);
        }
        .result-box {
            background-color: var(--btn-bg);
            border-radius: 20px;
            padding: 24px;
            margin-top: 20px;
            display: none;
        }
        .result-box.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
        }
        .result-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .result-label {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .result-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .result-value.total {
            color: var(--btn-operator-color);
            font-size: 24px;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="if(history.length > 1) { history.back(); } else { window.location.href='../index.html'; }" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Tip Calculator</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <div class="tool-content">
            <div class="input-group">
                <label for="bill">Bill Amount</label>
                <div style="display: flex; gap: 8px;">
                    <select id="currency" style="padding: 16px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background-color: var(--btn-bg); color: var(--text-primary); font-size: 16px; outline: none; cursor: pointer;">
                        <option value="$">$ USD</option>
                        <option value="৳">৳ BDT</option>
                        <option value="₹">₹ INR</option>
                        <option value="€">€ EUR</option>
                        <option value="£">£ GBP</option>
                    </select>
                    <input type="number" id="bill" placeholder="0.00" min="0" step="0.01" style="flex-grow: 1;">
                </div>
            </div>
            
            <div class="input-group">
                <label for="tip">Tip Amount</label>
                <input type="number" id="tip" placeholder="0.00" value="" min="0">
            </div>

            <div class="input-group">
                <label for="split">Split (Number of people)</label>
                <input type="number" id="split" placeholder="1" value="" min="1">
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear Data</button>
                <button class="btn-primary" id="calc-btn">Calculate</button>
            </div>

            <div class="result-box" id="result-box">
                <div class="result-row">
                    <span class="result-label">Tip Amount</span>
                    <span class="result-value" id="tip-amount">$0.00</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Total Amount</span>
                    <span class="result-value total" id="total-amount">$0.00</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Amount Per Person</span>
                    <span class="result-value" id="per-person">$0.00</span>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/tip-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
