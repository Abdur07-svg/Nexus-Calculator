<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator - Nexus</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .tool-content {
            background-color: var(--calc-bg);
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }
        .course-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
        }
        .course-row input, .course-row select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: var(--btn-bg);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .remove-btn {
            background: none;
            border: none;
            color: #ff5252;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
        }
        .add-course-btn {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px dashed rgba(255,255,255,0.2);
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 24px;
            transition: background-color 0.2s ease;
        }
        .add-course-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .btn-row {
            display: flex;
            gap: 16px;
        }
        .result-box {
            margin-top: 30px;
            padding: 24px;
            background-color: var(--btn-bg);
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .result-value {
            font-size: 40px;
            font-weight: 600;
            color: var(--btn-operator-color);
            margin-bottom: 8px;
        }
        .result-details {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .btn-primary {
            flex: 2;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: var(--btn-operator-color);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-clear {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: #ff5252;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:active, .btn-clear:active {
            transform: scale(0.95);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
        /* Hide labels visually but keep for screen readers if needed */
        .headers {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 8px;
            padding-right: 36px; /* space for remove btn */
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="window.location.href='../index.html'" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">GPA Calculator</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;" id="search-btn"></i>
        </div>

        <div class="tool-content">
            <div class="headers">
                <div>Course Name</div>
                <div>Credits</div>
                <div>Grade</div>
            </div>
            <div id="course-list">
                <!-- Rows injected via JS -->
            </div>
            
            <button class="add-course-btn" id="add-course-btn"><i class="fa-solid fa-plus"></i> Add Course</button>

            <div class="error-msg" id="error-msg"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear All</button>
                <button class="btn-primary" id="calc-btn">Calculate GPA</button>
            </div>

            <div class="result-box" id="result-box">
                <div class="result-value" id="main-gpa">0.00</div>
                <div class="result-details" id="detailed-gpa">Total Credits: 0</div>
            </div>
        </div>
    </div>
    
    <script src="../js/gpa-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
