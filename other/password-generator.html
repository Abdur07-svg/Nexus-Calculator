<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Nexus</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-content {
            flex-grow: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-group label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input[type="number"], .input-group input[type="range"] {
            padding: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--btn-bg);
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--btn-bg);
            padding: 16px;
            border-radius: 15px;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--btn-operator-color);
            cursor: pointer;
        }
        .checkbox-group label {
            color: var(--text-primary);
            font-size: 15px;
            cursor: pointer;
            flex-grow: 1;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn-primary {
            flex: 2;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: var(--btn-operator-color);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-clear {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: #ff5252;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-primary:active, .btn-clear:active {
            transform: scale(0.95);
        }
        .result-box {
            background-color: var(--btn-bg);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin-top: 20px;
            position: relative;
        }
        .result-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--btn-operator-color);
            margin-bottom: 8px;
            word-break: break-all;
        }
        .copy-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .copy-btn:hover {
            color: var(--text-primary);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="if(history.length > 1) { history.back(); } else { window.location.href='../index.html'; }" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Password Generator</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <div class="tool-content">
            <div class="result-box">
                <div class="result-value" id="password-display">Click Generate</div>
                <button class="copy-btn" id="copy-btn" title="Copy to clipboard"><i class="fa-regular fa-copy"></i></button>
            </div>

            <div class="input-group">
                <label for="length">Password Length</label>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <input type="range" id="length-slider" min="4" max="32" value="12" style="flex-grow: 1;">
                    <input type="number" id="length" min="4" max="32" value="12" style="width: 80px; text-align: center; padding: 12px;">
                </div>
            </div>

            <label class="checkbox-group">
                <input type="checkbox" id="uppercase" checked>
                <span>Include Uppercase Letters (A-Z)</span>
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="lowercase" checked>
                <span>Include Lowercase Letters (a-z)</span>
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="numbers" checked>
                <span>Include Numbers (0-9)</span>
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="symbols" checked>
                <span>Include Symbols (!@#$)</span>
            </label>

            <div class="error-msg" id="error-msg"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear Data</button>
                <button class="btn-primary" id="generate-btn">Generate</button>
            </div>
        </div>
    </div>
    <script src="../js/password-generator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
