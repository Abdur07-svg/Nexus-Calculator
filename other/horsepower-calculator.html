<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horsepower Calculator - Nexus</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .tool-content {
            background-color: var(--calc-bg);
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }
        .input-group {
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: var(--btn-bg);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--btn-operator-color);
        }
        .row-group {
            display: flex;
            gap: 16px;
        }
        .row-group .input-group {
            flex: 1;
        }
        .btn-row {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }
        .result-box {
            margin-top: 30px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            display: none;
        }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .result-item {
            background-color: var(--btn-bg);
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }
        .result-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .result-value {
            font-size: 32px;
            font-weight: 600;
            color: #ff9800;
            word-break: break-word;
        }

        .btn-primary {
            flex: 2;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: var(--btn-operator-color);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-clear {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: #ff5252;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:active, .btn-clear:active {
            transform: scale(0.95);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
        .error-msg {
            color: #ff5252;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="window.location.href='../index.html'" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Horsepower</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;" id="search-btn"></i>
        </div>

        <div class="tool-content">
            <div class="input-group">
                <label>Calculation Method</label>
                <select id="hp-method">
                    <option value="et">Elapsed Time (ET) Method</option>
                    <option value="speed">Trap Speed (MPH) Method</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Vehicle Weight</label>
                <div class="row-group" style="gap: 8px;">
                    <input type="number" id="hp-weight" placeholder="e.g. 3500" style="flex: 2;">
                    <select id="hp-weight-unit" style="flex: 1;">
                        <option value="lbs">lbs</option>
                        <option value="kg">kg</option>
                    </select>
                </div>
            </div>

            <div class="input-group" id="et-group">
                <label>Quarter Mile Time</label>
                <div class="row-group" style="gap: 8px;">
                    <input type="number" id="hp-et" placeholder="e.g. 13.5" style="flex: 2;">
                    <select id="hp-et-unit" style="flex: 1;">
                        <option value="sec">Seconds</option>
                        <option value="min">Minutes</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group" id="speed-group" style="display: none;">
                <label>Quarter Mile Trap Speed</label>
                <div class="row-group" style="gap: 8px;">
                    <input type="number" id="hp-speed" placeholder="e.g. 105" style="flex: 2;">
                    <select id="hp-speed-unit" style="flex: 1;">
                        <option value="mph">MPH</option>
                        <option value="kmh">km/h</option>
                    </select>
                </div>
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear</button>
                <button class="btn-primary" id="calc-btn">Calculate HP</button>
            </div>

            <div class="result-box" id="result-box">
                <div class="result-grid" style="grid-template-columns: 1fr 1fr;">
                    <div class="result-item" style="grid-column: span 2;">
                        <div class="result-label">Mechanical Horsepower (US)</div>
                        <div class="result-value" id="res-mech" style="font-size: 32px; color: #ff9800;">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Metric Horsepower (PS)</div>
                        <div class="result-value" id="res-metric" style="font-size: 24px;">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Kilowatts (kW)</div>
                        <div class="result-value" id="res-kw" style="font-size: 24px;">-</div>
                    </div>
                    <div class="result-item" style="grid-column: span 2;">
                        <div class="result-label">Foot-pounds per second</div>
                        <div class="result-value" id="res-ftlb" style="font-size: 20px;">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../js/horsepower-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
