<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion Calculator - Nexus</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .tool-content {
            background-color: var(--calc-bg);
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }
        .input-group {
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: var(--btn-bg);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--btn-operator-color);
        }
        .row-group {
            display: flex;
            gap: 16px;
        }
        .row-group .input-group {
            flex: 1;
        }
        .btn-row {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }
                .result-box {
            margin-top: 30px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            display: none;
        }
        .result-value {
            font-size: 32px;
            word-break: break-word;
            font-weight: 600;
            color: var(--btn-operator-color);
            margin-bottom: 8px;
            word-wrap: break-word;
        }
        .result-details {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .btn-primary {
            flex: 2;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: var(--btn-operator-color);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-clear {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: #ff5252;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:active, .btn-clear:active {
            transform: scale(0.95);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
        .error-msg {
            color: #ff5252;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="if(history.length > 1) { history.back(); } else { window.location.href='../index.html'; }" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Conversion Calculator</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;" id="search-btn"></i>
        </div>

        <div class="tool-content">
            <div class="input-group">
                <label>Category</label>
                <select id="category-select">
                    <option value="length">Length</option>
                    <option value="weight">Weight / Mass</option>
                    <option value="temperature">Temperature</option>
                    <option value="area">Area</option>
                    <option value="volume">Volume</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Value</label>
                <input type="number" id="input-value" placeholder="e.g. 10">
            </div>

            <div class="row-group">
                <div class="input-group">
                    <label>From</label>
                    <select id="from-unit"></select>
                </div>
                <div class="input-group">
                    <label>To</label>
                    <select id="to-unit"></select>
                </div>
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear Data</button>
                <button class="btn-primary" id="calc-btn">Calculate</button>
            </div>

            <div class="result-box" id="result-box">
                <div class="result-value" id="main-result">-</div>
                <div class="result-details" id="detailed-result">-</div>
            </div>
        </div>
    </div>
    
    <script src="../js/conversion-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
