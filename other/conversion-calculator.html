<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion Calculator</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="calculator-wrapper">

        <div class="top-nav-bar">
            <a href="../index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </a>
        </div>
        <div class="calculator" style="width: 100%; max-width: 420px;">

            <div class="calc-view active">
                <div class="calc-header">
                    <h2>Conversion Calculator</h2>
                    <p>Convert units of length, weight, temp, and more</p>
                </div>
                
                <div class="form-box">
                    <div class="input-group">
                        <label>Category</label>
                        <select id="conv-category" class="custom-input">
                            <option value="length">Length</option>
                            <option value="weight">Weight / Mass</option>
                            <option value="temperature">Temperature</option>
                            <option value="volume">Volume</option>
                        </select>
                    </div>

                    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
                        <div class="input-group" style="flex: 1; margin: 0;">
                            <label>Value</label>
                            <input type="number" id="conv-input" class="custom-input" placeholder="0">
                        </div>
                        <div class="input-group" style="flex: 1; margin: 0;">
                            <label>From</label>
                            <select id="conv-from" class="custom-input"></select>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: center; margin-bottom: 10px;">
                        <button id="swap-btn" style="cursor: pointer; color: var(--text-secondary); transition: all 0.3s; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--btn-bg); border: 1px solid var(--calc-border);"><i class="fas fa-exchange-alt" style="transform: rotate(90deg);"></i></button>
                    </div>

                    <div class="input-group" style="margin-bottom: 0;">
                        <label>To</label>
                        <select id="conv-to" class="custom-input"></select>
                    </div>

                </div>
                
                <div class="result-container" id="conv-result-container">
                    <div class="age-main" id="conv-main-result" style="font-size: 2rem; color: var(--calc-accent); margin-bottom: 0; overflow-wrap: break-word;">
                        0
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/script.js"></script>
    <script src="../js/conversion.js"></script>

    <script>
        document.addEventListener('click', function(e) {
            if (e.target && e.target.matches && e.target.matches('.action-btn:not(.clear-btn)')) {
                const formBox = e.target.closest('.form-box');
                if (formBox) {
                    const inputs = formBox.querySelectorAll('input[type="number"], input[type="text"]');
                    let isEmpty = false;
                    inputs.forEach(input => {
                        if (input.value.trim() === '') isEmpty = true;
                    });
                    
                    if (isEmpty) {
                        e.stopPropagation();
                        e.preventDefault();
                        
                        let errorMsg = formBox.querySelector('.global-error-msg');
                        if (!errorMsg) {
                            errorMsg = document.createElement('div');
                            errorMsg.className = 'global-error-msg';
                            errorMsg.style.color = '#ef4444';
                            errorMsg.style.fontSize = '0.9rem';
                            errorMsg.style.marginTop = '15px';
                            errorMsg.style.textAlign = 'center';
                            errorMsg.style.fontWeight = '500';
                            errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please fill out all required fields.';
                            
                            // Insert at the end of form-box
                            formBox.appendChild(errorMsg);
                        }
                        
                        // Hide results if they are shown
                        const resultContainer = document.querySelector('.result-container');
                        if (resultContainer) resultContainer.style.display = 'none';
                    } else {
                        const errorMsg = formBox.querySelector('.global-error-msg');
                        if (errorMsg) errorMsg.remove();
                    }
                }
            }
        }, true); // Use capture phase to intercept before the button's own listener
    </script>
</body>
</html>
