<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTU Calculator - Nexus</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-content { flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { color: var(--text-secondary); font-size: 14px; font-weight: 500; }
        .input-group input, .input-group select { 
            width: 100%; box-sizing: border-box; min-width: 0;
            padding: 16px; border-radius: 15px; border: 1px solid rgba(0, 0, 0, 0.1); 
            background-color: var(--btn-bg); color: var(--text-primary); font-size: 16px; 
            font-family: inherit; outline: none; transition: border-color 0.3s; 
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--btn-operator-color); }
        .checkbox-group { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--text-primary); font-weight: 500; margin-top: 5px; }
        .checkbox-group input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--btn-operator-color); }
        .btn-row { display: flex; gap: 12px; margin-top: 10px; }
        .btn-primary { flex: 2; padding: 16px; border-radius: 15px; border: none; background-color: var(--btn-operator-color); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-clear { flex: 1; padding: 16px; border-radius: 15px; border: none; background-color: #ff5252; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn-primary:active, .btn-clear:active { transform: scale(0.95); }
        .result-box { background: rgba(33, 150, 243, 0.08); border: 1px solid rgba(33, 150, 243, 0.2); border-radius: 15px; padding: 20px; text-align: center; margin-top: 20px; display: none; }
        .result-box.active { display: block; }
        .result-details { color: var(--text-primary); font-size: 15px; line-height: 1.6; }
        .back-btn { background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; }
        .error-msg { color: #ff5252; font-size: 14px; display: none; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="window.location.href='../index.html'" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">AC BTU Calculator</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <div class="tool-content">
            <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: -10px;">Calculate the Air Conditioner capacity (BTU) needed for a room.</div>
            
            <div class="input-group">
                <label for="length">Room Length</label>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="length" placeholder="e.g. 15" style="flex:2;" step="any" min="0">
                    <select id="len-unit" style="flex:1; max-width: 100px;">
                        <option value="ft" selected>ft</option>
                        <option value="m">m</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">
                <label for="width">Room Width</label>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="width" placeholder="e.g. 20" style="flex:2;" step="any" min="0">
                    <select id="wid-unit" style="flex:1; max-width: 100px;">
                        <option value="ft" selected>ft</option>
                        <option value="m">m</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="height">Ceiling Height</label>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="height" placeholder="e.g. 8" value="8" style="flex:2;" step="any" min="0">
                    <select id="hgt-unit" style="flex:1; max-width: 100px;">
                        <option value="ft" selected>ft</option>
                        <option value="m">m</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="room-type">Room Type</label>
                <select id="room-type">
                    <option value="bedroom" selected>Bedroom</option>
                    <option value="living_room">Living Room</option>
                    <option value="kitchen">Kitchen</option>
                    <option value="basement">Basement</option>
                    <option value="attic">Attic</option>
                </select>
            </div>

            <div class="input-group">
                <label for="exposure">Sun Exposure</label>
                <select id="exposure">
                    <option value="normal" selected>Normal</option>
                    <option value="shaded">Heavily Shaded</option>
                    <option value="sunny">Very Sunny</option>
                </select>
            </div>

            <div class="input-group">
                <label for="people">Typical Occupants</label>
                <input type="number" id="people" value="2" min="1" step="1">
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear</button>
                <button class="btn-primary" id="calc-btn">Calculate BTU</button>
            </div>

            <div class="result-box" id="result-box">
                <div class="result-details" id="detailed-res"></div>
            </div>
        </div>
    </div>
    <script src="../js/btu-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
