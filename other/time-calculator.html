<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Calculator - Nexus</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .tool-content {
            background-color: var(--calc-bg);
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }
        .mode-toggle {
            display: flex;
            background-color: var(--btn-bg);
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 24px;
        }
        .mode-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .mode-btn.active {
            background-color: var(--btn-operator-color);
            color: white;
            box-shadow: 0 2px 8px rgba(255, 82, 82, 0.3);
        }
        .input-group {
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: var(--btn-bg);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--btn-operator-color);
        }
        .add-sub-group {
            display: flex;
            gap: 16px;
        }
        .btn-row {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }
        .result-box {
            margin-top: 30px;
            padding: 24px;
            background-color: var(--btn-bg);
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .result-value {
            font-size: 32px;
            font-weight: 300;
            color: var(--btn-operator-color);
            margin-bottom: 8px;
        }
        .result-details {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .btn-primary {
            flex: 2;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: var(--btn-operator-color);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-clear {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background-color: #ff5252;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:active, .btn-clear:active {
            transform: scale(0.95);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="window.location.href='../index.html'" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Time Calculator</h2>
            <i class="fa-solid fa-magnifying-glass" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;" id="search-btn"></i>
        </div>

        <div class="tool-content">
            <div class="mode-toggle">
                <button class="mode-btn active" id="mode-between">Time Between</button>
                <button class="mode-btn" id="mode-addsub">Add / Subtract Time</button>
            </div>

            <!-- Time Between Inputs -->
            <div id="between-inputs">
                <div class="input-group">
                    <label for="start-time-1">Start Time (e.g. 14:30 or 2:30 PM)</label>
                    <input type="text" id="start-time-1" placeholder="HH:MM AM/PM" required>
                </div>
                
                <div class="input-group">
                    <label for="end-time-1">End Time (e.g. 18:45 or 6:45 PM)</label>
                    <input type="text" id="end-time-1" placeholder="HH:MM AM/PM" required>
                </div>
            </div>

            <!-- Add/Subtract Inputs -->
            <div id="addsub-inputs" style="display: none;">
                <div class="input-group">
                    <label for="base-time">Start Time (e.g. 14:30 or 2:30 PM)</label>
                    <input type="text" id="base-time" placeholder="HH:MM AM/PM" required>
                </div>
                
                <div class="add-sub-group">
                    <div class="input-group" style="flex: 1.2;">
                        <label for="operation">Operation</label>
                        <select id="operation">
                            <option value="add">Add (+)</option>
                            <option value="sub">Subtract (-)</option>
                        </select>
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label for="add-hours">Hours</label>
                        <input type="number" id="add-hours" placeholder="0" min="0">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label for="add-mins">Minutes</label>
                        <input type="number" id="add-mins" placeholder="0" min="0" max="59">
                    </div>
                </div>
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear Data</button>
                <button class="btn-primary" id="calc-btn">Calculate</button>
            </div>

            <div class="result-box" id="result-box">
                <div class="result-value" id="main-result">-</div>
                <div class="result-details" id="detailed-result">-</div>
            </div>
        </div>
    </div>
    
    <script src="../js/time-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
