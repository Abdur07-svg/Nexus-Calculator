<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Calculator</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #ffffff;
            --calc-bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #2196f3;
            --btn-bg: #f4f6f8;
            --btn-hover: #e8ecf1;
            --btn-operator-bg: #2196f3;
            --btn-operator-color: #2196f3;
        }

        .tool-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .visual-container {
            position: relative;
            width: 320px;
            height: 280px;
            margin: 20px auto 40px auto;
        }

        .visual-container svg {
            width: 100%;
            height: 100%;
        }

        .input-wrapper {
            position: absolute;
            background: white;
            border: 1px solid #777;
            border-radius: 4px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            overflow: hidden;
            width: 70px;
            height: 28px;
        }

        .input-wrapper input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            padding: 0 4px;
            font-size: 14px;
            text-align: center;
        }

        .input-wrapper input[type="number"]::-webkit-inner-spin-button,
        .input-wrapper input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .unit-symbol {
            font-size: 12px;
            color: #666;
            padding-right: 4px;
            user-select: none;
        }

        /* Positions */
        .pos-angle-c { top: 0; left: 125px; }
        .pos-angle-a { bottom: 35px; left: 0; }
        .pos-angle-b { bottom: 35px; right: 0; }
        
        .pos-side-b { top: 120px; left: 20px; }
        .pos-side-a { top: 120px; right: 20px; }
        .pos-side-c { bottom: 0; left: 125px; }

        .unit-select-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .unit-select-row select {
            padding: 8px 12px;
            border: 2px solid #000;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            background: white;
            outline: none;
            cursor: pointer;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        .btn-primary {
            flex: 2;
            padding: 16px;
            background-color: var(--btn-operator-color);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-clear {
            flex: 1;
            padding: 16px;
            background-color: #ff5252;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .result-box {
            background: rgba(33, 150, 243, 0.08);
            border: 1px solid rgba(33, 150, 243, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }

        .error-msg {
            color: #ff5252;
            font-size: 14px;
            display: none;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="calculator-container">
        <div class="top-bar" style="position: sticky; top: -16px; background-color: var(--calc-bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px 0 10px 0;">
            <button class="back-btn" onclick="if(history.length > 1) { history.back(); } else { window.location.href='../index.html'; }" style="position: absolute; left: 16px;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 style="color: var(--text-primary); margin: 0; font-size: 20px;">Triangle Calculator</h2>
            <i class="fa-solid fa-magnifying-glass" id="search-btn" title="Search" style="position: absolute; right: 16px; font-size: 20px; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <div class="tool-content">
            
            <div class="visual-container">
                <svg viewBox="0 0 320 280">
                    <!-- Main Triangle -->
                    <polygon points="160,40 60,210 260,210" fill="none" stroke="#000" stroke-width="3"/>
                    
                    <!-- Angle Arcs (Blue) -->
                    <path d="M 148,60 A 25,25 0 0,0 172,60" fill="none" stroke="blue" stroke-width="2"/>
                    <path d="M 85,210 A 25,25 0 0,0 72,190" fill="none" stroke="blue" stroke-width="2"/>
                    <path d="M 248,190 A 25,25 0 0,0 235,210" fill="none" stroke="blue" stroke-width="2"/>
                    
                    <!-- Vertex Labels (Blue) -->
                    <text x="160" y="80" fill="blue" font-size="20" font-family="Arial" text-anchor="middle">C</text>
                    <text x="75" y="200" fill="blue" font-size="20" font-family="Arial">A</text>
                    <text x="235" y="200" fill="blue" font-size="20" font-family="Arial">B</text>
                    
                    <!-- Side Labels (Green) -->
                    <text x="95" y="130" fill="green" font-size="16" font-family="Arial">side b</text>
                    <text x="180" y="130" fill="green" font-size="16" font-family="Arial">side a</text>
                    <text x="160" y="205" fill="green" font-size="16" font-family="Arial" text-anchor="middle">side c</text>
                </svg>

                <div class="input-wrapper pos-angle-c">
                    <input type="number" id="val-C" step="any">
                    <span class="unit-symbol">&deg;</span>
                </div>
                <div class="input-wrapper pos-angle-a">
                    <input type="number" id="val-A" step="any">
                    <span class="unit-symbol">&deg;</span>
                </div>
                <div class="input-wrapper pos-angle-b">
                    <input type="number" id="val-B" step="any">
                    <span class="unit-symbol">&deg;</span>
                </div>

                <div class="input-wrapper pos-side-a">
                    <input type="number" id="val-a" step="any">
                </div>
                <div class="input-wrapper pos-side-b">
                    <input type="number" id="val-b" step="any">
                </div>
                <div class="input-wrapper pos-side-c">
                    <input type="number" id="val-c" step="any">
                </div>
            </div>

            <div class="unit-select-row">
                Angle Unit: 
                <select id="angle-unit">
                    <option value="degree">degree &deg;</option>
                    <option value="radian">radian rad</option>
                </select>
            </div>

            <div class="error-msg" id="error-msg">Please enter valid values. Provide at least 3 values including one side.</div>

            <div class="btn-row">
                <button class="btn-clear" id="clear-btn">Clear</button>
                <button class="btn-primary" id="calc-btn">Calculate</button>
            </div>

            <div class="result-box" id="result-box">
                <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 5px;">Area</div>
                <div style="font-size: 28px; font-weight: 700; color: var(--btn-operator-color);" id="result-area">0</div>
                <div style="font-size: 16px; color: var(--text-secondary); margin-top: 15px;">Perimeter: <span id="result-perimeter" style="color: var(--text-primary); font-weight: 600;">0</span></div>
            </div>
        </div>
    </div>

    <script src="../js/capacitor_plugins.js"></script>
    <script src="../js/triangle-calculator.js"></script>
    <script src="../js/search.js"></script>
</body>

</html>
